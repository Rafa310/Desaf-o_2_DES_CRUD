version: '3.8'

services:
  mysql-eventos:
    image: mysql:8.0
    container_name: eventos_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: bd_des104_d2
    ports:
      - "3307:3306"
    volumes:
      - ./sql-script:/docker-entrypoint-initdb.d
      - datos_mysql:/var/lib/mysql

volumes:
  datos_mysql: